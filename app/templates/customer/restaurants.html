{% extends "base.html" %}

{% block title %}Discover Restaurants{% endblock %}

{% block content %}
<div class="customer-container">
    <h2>Discover Restaurants</h2>
    
    <form method="GET" action="{{ url_for('customer.list_restaurants') }}" style="margin-bottom: 20px;">
        <input type="text" name="name" placeholder="Search by name..." value="{{ request.args.get('name', '') }}">
        <input type="text" name="city" placeholder="Filter by city..." value="{{ request.args.get('city', '') }}">
        <button type="submit">Search</button>
        <a href="{{ url_for('customer.list_restaurants') }}">Clear</a>
    </form>
    
    <div class="restaurant-list">
        {% for r in restaurants %}
        <div class="restaurant-card" style="border: 1px solid #ccc; padding: 15px; margin-bottom: 10px;">
            <h3><a href="{{ url_for('customer.restaurant_detail', restaurant_id=r.id) }}">{{ r.name }}</a></h3>
            <p><strong>City:</strong> {{ r.city }}</p>
            <p>{{ r.description }}</p>
        </div>
        {% else %}
        <p>No restaurants found.</p>
        {% endfor %}
    </div>
    
    <br>
    <a href="{{ url_for('customer.dashboard') }}">Back to Dashboard</a>
</div>
{% endblock %}
